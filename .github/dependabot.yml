version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep routine updates within the SDK/toolchain ranges in package.json.
    # Widen those ranges deliberately in a coordinated, tested migration.
    versioning-strategy: lockfile-only
    groups:
      expo-runtime:
        patterns: [expo, "expo-*", "@expo/*", react, react-dom, react-native, "react-native-*", "@react-native/*"]
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
