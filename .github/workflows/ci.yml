name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Check Expo SDK compatibility
        run: pnpm exec expo install --check
        env:
          EXPO_OFFLINE: "1"
      - run: pnpm run validate
      - name: Verify generated API files
        run: |
          pnpm run api:types
          git diff --exit-code -- src/services/cloud-api/schema.d.ts src/services/cloud-api/write-operations.generated.ts
