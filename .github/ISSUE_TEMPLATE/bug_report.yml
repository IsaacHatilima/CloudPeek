name: Bug report
description: Report a reproducible problem in Cloud Peek.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use SECURITY.md. Remove tokens and private environment values from all screenshots and logs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 17, iOS 26; simulator or physical device
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or logs
